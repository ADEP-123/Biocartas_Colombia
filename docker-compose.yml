version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: biocartas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: biocartas
      POSTGRES_PASSWORD: biocartas_dev
      POSTGRES_DB: biocartas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biocartas"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: biocartas_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
    container_name: biocartas_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://biocartas:biocartas_dev@postgres:5432/biocartas?schema=public
      DIRECT_URL: postgresql://biocartas:biocartas_dev@postgres:5432/biocartas?schema=public
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: biocartas_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
